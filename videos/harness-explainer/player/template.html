<title>Что такое Harness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600;700;800&display=swap">
<style>
/* Тёмный «кинозал» в тон ролику: плеер в центре, под ним шкала с цветными главами и оглавление */
:root {
  color-scheme: dark;
  --bg: #08090f;
  --panel: #12131c;
  --panel-2: #191a26;
  --line: rgba(255, 255, 255, 0.10);
  --fg: #f6f2ea;
  --dim: rgba(246, 242, 234, 0.64);
  --faint: rgba(246, 242, 234, 0.38);
  --accent: #ff8a5b;
  --amber: #ffc46b;
  --display: "Unbounded", "Manrope", system-ui, sans-serif;
  --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html, body { background: var(--bg); color: var(--fg); }
body {
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  padding: 28px 20px 48px;
  background:
    radial-gradient(ellipse 60% 40% at 15% 0%, rgba(255, 138, 91, 0.13), transparent 70%),
    radial-gradient(ellipse 50% 40% at 90% 10%, rgba(162, 140, 255, 0.10), transparent 70%),
    var(--bg);
  min-height: 100%;
}
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 22px; }
header { display: grid; gap: 8px; }
.kicker { font-weight: 800; font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--amber); }
h1 {
  margin: 0; font-family: var(--display); font-weight: 700; letter-spacing: -0.01em;
  font-size: clamp(28px, 5vw, 48px); line-height: 1.08; text-wrap: balance;
}
h1 span { color: var(--accent); }
.meta { color: var(--dim); font-size: 15px; display: flex; flex-wrap: wrap; gap: 6px 16px; }
.meta b { color: var(--fg); font-weight: 700; }

.player {
  position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9;
  background: #000; border-radius: 18px; overflow: hidden;
  border: 1px solid var(--line);
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
}
.player video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
.player video.off { visibility: hidden; }
.player .poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.bigplay {
  position: absolute; inset: 0; margin: auto; width: 92px; height: 92px; border-radius: 50%;
  border: 0; cursor: pointer; background: var(--accent); color: #1a0f08;
  display: grid; place-items: center; box-shadow: 0 10px 40px rgba(255, 138, 91, 0.45);
  transition: transform 0.15s ease;
}
.bigplay:hover { transform: scale(1.06); }
.bigplay:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
.spinner {
  position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px;
  border-radius: 50%; border: 4px solid rgba(255, 255, 255, 0.2); border-top-color: var(--accent);
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.5s; } .bigplay { transition: none; } }

.controls {
  display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 14px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px 16px;
}
.btn {
  width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--panel-2); color: var(--fg); cursor: pointer; display: grid; place-items: center;
}
.btn:hover { border-color: rgba(255, 255, 255, 0.25); }
.time { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 14px; white-space: nowrap; }
.time b { color: var(--fg); font-weight: 700; }

.track { position: relative; height: 34px; min-width: 0; }
.segs { position: absolute; left: 0; right: 0; top: 13px; height: 8px; display: flex; gap: 3px; }
.seg { position: relative; height: 100%; border-radius: 4px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
.seg i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 4px; }
.track input[type="range"] {
  position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer;
}
.head {
  position: absolute; top: 9px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%;
  background: var(--fg); box-shadow: 0 0 0 4px rgba(255, 138, 91, 0.35); pointer-events: none;
}

.chapters { display: grid; gap: 10px; }
.chapters h2 { margin: 6px 0 4px; font-family: var(--display); font-size: 20px; font-weight: 500; }
.list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.ch {
  display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 12px; text-align: left;
  padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel);
  color: var(--fg); font: inherit; cursor: pointer; min-width: 0;
}
.ch:hover { background: var(--panel-2); }
.ch .n { font-family: var(--display); font-weight: 700; font-size: 15px; }
.ch .t { font-weight: 700; font-size: 15px; min-width: 0; }
.ch .at { color: var(--faint); font-variant-numeric: tabular-nums; font-size: 13px; }
.ch.cur { border-color: currentColor; background: var(--panel-2); }
.ch.cur .t { color: var(--fg); }
.note { color: var(--faint); font-size: 13px; }
.err { color: #ff8f8f; font-size: 14px; }

@media (max-width: 560px) {
  .controls { grid-template-columns: auto 1fr auto; gap: 10px; padding: 10px 12px; }
  .controls .fs { display: none; }
  .time { font-size: 12px; }
}
</style>

<div class="wrap">
  <header>
    <div class="kicker">Обучающий ролик · простыми словами</div>
    <h1>Что такое <span>Harness</span></h1>
    <div class="meta"><span><b>23 минуты</b></span><span>озвучка и субтитры</span><span>настоящие скриншоты Claude Code</span><span>10 частей</span></div>
  </header>

  <div class="player" id="player">
    <img class="poster" id="poster" src="poster.jpg" alt="Титульный кадр ролика «Что такое Harness»">
    <video id="va" playsinline preload="metadata"></video>
    <video id="vb" class="off" playsinline preload="none"></video>
    <div class="spinner" id="spin" hidden></div>
    <button class="bigplay" id="bigplay" aria-label="Смотреть ролик">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
    </button>
  </div>

  <div class="controls">
    <button class="btn" id="pp" aria-label="Воспроизвести">
      <svg id="ico-play" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
      <svg id="ico-pause" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
    </button>
    <div class="track">
      <div class="segs" id="segs"></div>
      <div class="head" id="head"></div>
      <input type="range" id="seek" min="0" max="1000" step="1" value="0" aria-label="Перемотка">
    </div>
    <div class="time"><b id="cur">0:00</b> / <span id="dur">23:00</span></div>
    <button class="btn fs" id="fs" aria-label="Во весь экран">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>
  <div class="err" id="err" hidden></div>

  <section class="chapters">
    <h2>Оглавление</h2>
    <div class="list" id="list"></div>
    <p class="note">Нажмите на главу, чтобы перейти к ней. Пробел — пауза, стрелки — ±10 секунд.</p>
  </section>
</div>

<script>
const PARTS = /*PARTS*/[];
const CHAPTERS = /*CHAPTERS*/[];
const COLORS = ["#ff8a5b", "#ffc46b", "#5dd6f2", "#a28cff", "#5fdca0", "#ff8a5b", "#ffc46b", "#ff6b7a", "#ff7ec1", "#5fdca0"];

const offs = [];
let total = 0;
for (const p of PARTS) { offs.push(total); total += p.d; }

const $ = (id) => document.getElementById(id);
const vids = [$("va"), $("vb")];
let act = 0;          // индекс активного <video>
let part = 0;         // текущая часть
let started = false;
let wantPlay = false;
let seeking = false;

const fmt = (s) => {
  s = Math.max(0, Math.floor(s));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
};
$("dur").textContent = fmt(total);

// шкала: цветные отрезки глав
const segs = $("segs");
CHAPTERS.forEach((c, i) => {
  const end = i + 1 < CHAPTERS.length ? CHAPTERS[i + 1].t : total;
  const el = document.createElement("div");
  el.className = "seg";
  el.style.flex = String(end - c.t);
  el.title = c.title;
  const fill = document.createElement("i");
  fill.style.background = COLORS[i % COLORS.length];
  el.appendChild(fill);
  segs.appendChild(el);
});

// оглавление
const list = $("list");
CHAPTERS.forEach((c, i) => {
  const b = document.createElement("button");
  b.className = "ch";
  b.id = "ch" + i;
  b.style.color = COLORS[i % COLORS.length];
  b.innerHTML = '<span class="n"></span><span class="t"></span><span class="at"></span>';
  b.querySelector(".n").textContent = String(i).padStart(2, "0");
  b.querySelector(".t").textContent = c.title;
  b.querySelector(".at").textContent = fmt(c.t);
  b.addEventListener("click", () => { seekTo(c.t, true); $("player").scrollIntoView({behavior: "smooth", block: "center"}); });
  list.appendChild(b);
});

const locate = (g) => {
  g = Math.min(Math.max(g, 0), total - 0.05);
  let i = 0;
  while (i + 1 < PARTS.length && offs[i + 1] <= g) i++;
  return [i, g - offs[i]];
};
const globalTime = () => offs[part] + (vids[act].currentTime || 0);

function showSpin(on) { $("spin").hidden = !on; }

function load(i, local, play) {
  const v = vids[act];
  part = i;
  const src = PARTS[i].src;
  const go = () => {
    try { v.currentTime = local; } catch (e) {}
    if (play) v.play().catch(() => {});
  };
  if (v.getAttribute("src") !== src) {
    v.preload = "auto";
    v.src = src;
    showSpin(true);
    v.addEventListener("loadedmetadata", go, {once: true});
  } else go();
  // соседний <video> заранее грузит следующую часть
  const o = vids[1 - act];
  if (i + 1 < PARTS.length && o.getAttribute("src") !== PARTS[i + 1].src) {
    o.preload = "auto";
    o.src = PARTS[i + 1].src;
  }
}

function seekTo(g, play) {
  const [i, local] = locate(g);
  if (!started) start();
  wantPlay = play ?? !vids[act].paused;
  if (i !== part || !vids[act].getAttribute("src")) load(i, local, wantPlay);
  else {
    vids[act].currentTime = local;
    if (wantPlay) vids[act].play().catch(() => {});
  }
  render();
}

function start() {
  started = true;
  $("poster").hidden = true;
  $("bigplay").hidden = true;
}

function playPause() {
  if (!started) { start(); wantPlay = true; load(part, 0, true); return; }
  const v = vids[act];
  if (v.paused) { wantPlay = true; v.play().catch(() => {}); } else { wantPlay = false; v.pause(); }
}

vids.forEach((v, k) => {
  v.addEventListener("ended", () => {
    if (k !== act) return;
    if (part + 1 >= PARTS.length) { wantPlay = false; render(); return; }
    const next = vids[1 - act];
    const nextPart = part + 1;
    v.classList.add("off");
    next.classList.remove("off");
    act = 1 - act;
    part = nextPart;
    if (next.getAttribute("src") !== PARTS[nextPart].src) { next.src = PARTS[nextPart].src; }
    try { next.currentTime = 0; } catch (e) {}
    next.play().catch(() => {});
    // освободившийся элемент грузит следующую часть
    if (part + 1 < PARTS.length) { v.preload = "auto"; v.src = PARTS[part + 1].src; }
  });
  v.addEventListener("waiting", () => { if (k === act) showSpin(true); });
  v.addEventListener("playing", () => { if (k === act) showSpin(false); render(); });
  v.addEventListener("canplay", () => { if (k === act) showSpin(false); });
  v.addEventListener("pause", () => { if (k === act) render(); });
  v.addEventListener("timeupdate", () => { if (k === act && !seeking) render(); });
  v.addEventListener("error", () => {
    if (k !== act) return;
    showSpin(false);
    $("err").hidden = false;
    $("err").textContent = "Не удалось загрузить часть ролика. Обновите страницу и попробуйте ещё раз.";
  });
});

function render() {
  const g = started ? globalTime() : 0;
  $("cur").textContent = fmt(g);
  const frac = total ? g / total : 0;
  if (!seeking) $("seek").value = String(Math.round(frac * 1000));
  $("head").style.left = (frac * 100) + "%";
  const fills = segs.querySelectorAll(".seg i");
  let curCh = 0;
  CHAPTERS.forEach((c, i) => {
    const end = i + 1 < CHAPTERS.length ? CHAPTERS[i + 1].t : total;
    const f = Math.min(1, Math.max(0, (g - c.t) / (end - c.t)));
    fills[i].style.width = (f * 100) + "%";
    if (g >= c.t) curCh = i;
  });
  document.querySelectorAll(".ch").forEach((b, i) => b.classList.toggle("cur", started && i === curCh));
  const playing = started && !vids[act].paused;
  $("ico-play").hidden = playing;
  $("ico-pause").hidden = !playing;
  $("pp").setAttribute("aria-label", playing ? "Пауза" : "Воспроизвести");
}

$("bigplay").addEventListener("click", playPause);
$("pp").addEventListener("click", playPause);
$("seek").addEventListener("input", (e) => {
  seeking = true;
  const g = (Number(e.target.value) / 1000) * total;
  $("cur").textContent = fmt(g);
  $("head").style.left = (g / total * 100) + "%";
});
$("seek").addEventListener("change", (e) => {
  seeking = false;
  seekTo((Number(e.target.value) / 1000) * total);
});
$("fs").addEventListener("click", () => {
  const el = $("player");
  try {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
  } catch (e) {}
});
document.addEventListener("keydown", (e) => {
  if (e.target && (e.target.tagName === "INPUT" && e.target.type !== "range")) return;
  if (e.code === "Space") { e.preventDefault(); playPause(); }
  else if (e.code === "ArrowRight") { e.preventDefault(); seekTo(globalTime() + 10); }
  else if (e.code === "ArrowLeft") { e.preventDefault(); seekTo(globalTime() - 10); }
});
render();
</script>
